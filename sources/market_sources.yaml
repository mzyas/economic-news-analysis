provider: yfinance
defaults:
  period: 3mo
  interval: 1d

symbols:
  # ── Equity Indices (price type) ──────────────────────────────────────
  - id: sp500
    ticker: ^GSPC
    name: S&P 500
    name_zh: 标普500
    asset_class: equity_index
    asset_type: price
    display_precision: 2
    region: US
    currency: USD

  - id: nasdaq100
    ticker: ^NDX
    name: Nasdaq 100
    name_zh: 纳斯达克100
