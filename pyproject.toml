[project]
name = "economic-news-analysis"
version = "0.9.0"
description = "LangGraph workflow for economic news analysis and market context."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0.0",
  "yfinance>=0.2.0",
  "langgraph>=0.4.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "langchain-openai>=0.3.0",
  "PyYAML>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = [
  "tools",
  "tools.graph",
  "tools.market_data",
  "tools.market_data.providers",
]
